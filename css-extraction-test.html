<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS Extraction Test</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 20px; font-family: Arial; }
        .test { background: yellow; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>CSS Extraction Test</h1>
    <button onclick="testExtraction()">Test CSS Extraction</button>
    <div id="results"></div>

    <script>
        async function testExtraction() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing...</h2>';
            
            let log = '';
            
            // Test 1: CSSOM
            log += '<div class="test"><h3>Test 1: CSSOM Extraction</h3>';
            try {
                const sheets = Array.from(document.styleSheets);
                log += `<p>Found ${sheets.length} stylesheets</p>`;
                
                let totalCSS = '';
                for (let i = 0; i < sheets.length; i++) {
                    const sheet = sheets[i];
                    const href = sheet.href || 'inline';
                    log += `<p><strong>Sheet ${i}:</strong> ${href}</p>`;
                    
                    try {
                        const rules = Array.from(sheet.cssRules || sheet.rules || []);
                        const css = rules.map(r => r.cssText).join('\\n');
                        totalCSS += css + '\\n';
                        log += `<p style="margin-left:20px;">✅ Rules: ${rules.length}, Size: ${css.length} chars</p>`;
                    } catch (e) {
                        log += `<p style="margin-left:20px;color:red;">❌ Error: ${e.message}</p>`;
                    }
                }
                log += `<p><strong>Total CSS from CSSOM: ${totalCSS.length} chars</strong></p>`;
                
                if (totalCSS.length > 10000) {
                    log += '<p style="color:green;font-weight:bold;">✅ SUCCESS: Got enough CSS!</p>';
                } else {
                    log += '<p style="color:orange;font-weight:bold;">⚠️ WARNING: Not enough CSS extracted</p>';
                }
            } catch (e) {
                log += `<p style="color:red;">❌ CSSOM failed: ${e.message}</p>`;
            }
            log += '</div>';
            
            // Test 2: XMLHttpRequest
            log += '<div class="test"><h3>Test 2: XMLHttpRequest</h3>';
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', './styles.css', false);
                xhr.send(null);
                
                if (xhr.status === 200 || xhr.status === 0) {
                    const css = xhr.responseText;
                    log += `<p style="color:green;">✅ XMLHttpRequest successful: ${css.length} chars</p>`;
                    if (css.length > 10000) {
                        log += '<p style="color:green;font-weight:bold;">✅ SUCCESS: Got enough CSS via XMLHttpRequest!</p>';
                    }
                } else {
                    log += `<p style="color:red;">❌ XMLHttpRequest failed: Status ${xhr.status}</p>`;
                }
            } catch (e) {
                log += `<p style="color:red;">❌ XMLHttpRequest error: ${e.message}</p>`;
            }
            log += '</div>';
            
            // Test 3: Fetch
            log += '<div class="test"><h3>Test 3: Fetch API</h3>';
            try {
                const response = await fetch('./styles.css');
                if (response.ok) {
                    const css = await response.text();
                    log += `<p style="color:green;">✅ Fetch successful: ${css.length} chars</p>`;
                } else {
                    log += `<p style="color:red;">❌ Fetch failed: HTTP ${response.status}</p>`;
                }
            } catch (e) {
                log += `<p style="color:orange;">⚠️ Fetch failed: ${e.message} (expected for file://)</p>`;
            }
            log += '</div>';
            
            // Test 4: Inline styles
            log += '<div class="test"><h3>Test 4: Inline Styles</h3>';
            const inlineStyles = Array.from(document.querySelectorAll('style'));
            log += `<p>Found ${inlineStyles.length} inline style tags</p>`;
            let inlineTotal = 0;
            inlineStyles.forEach((style, i) => {
                const len = style.textContent.length;
                inlineTotal += len;
                log += `<p>Style tag ${i}: ${len} chars</p>`;
            });
            log += `<p><strong>Total inline CSS: ${inlineTotal} chars</strong></p>`;
            log += '</div>';
            
            results.innerHTML = log;
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(testExtraction, 1000);
        });
    </script>
</body>
</html>
